{% load blog_tags %}

{% for post in page_obj %}
<article class="post-card" style="--order: {{ forloop.counter }}" data-reveal data-reveal-delay="{{ forloop.counter0 }}">
  <a class="post-card__link" href="{{ post.get_absolute_url }}">
    <span class="post-card__badge{% if post.category.slug == 'novyny' %} post-card__badge--news{% elif post.category.slug == 'porady' %} post-card__badge--tips{% endif %}">
      {{ post|blog_badge }}
    </span>
    <p class="post-card__meta">
      {% if post.published_label %}{{ post.published_label }}{% endif %}
      <span aria-hidden="true">•</span>
      {{ post.read_time_minutes }} хв читання
    </p>
    <h3 class="post-card__title">{{ post.title }}</h3>
    {% if post.excerpt %}
      <p class="post-card__summary">{{ post.excerpt }}</p>
    {% endif %}
    <span class="post-card__read">
      {{ post|blog_read_more }}
      <span class="post-card__arrow" aria-hidden="true">→</span>
    </span>
  </a>
</article>
{% endfor %}
