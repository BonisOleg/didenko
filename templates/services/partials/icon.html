{% with key=icon_key|default:"consult" %}
<span class="service-icon" aria-hidden="true">
  {% if key == "audit" %}
  <svg viewBox="0 0 24 24" fill="none">
    <path d="M4 19V5M4 19h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M8 15v-3M12 15V8M16 15v-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  </svg>
  {% elif key == "docs" %}
  <svg viewBox="0 0 24 24" fill="none">
    <path d="M7 3.5h7.5L19 8v12.5H7V3.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M14.5 3.5V8H19M9.5 12h5M9.5 15.5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  {% elif key == "support" %}
  <svg viewBox="0 0 24 24" fill="none">
    <path d="M12 3.5 19 7v5.2c0 4.1-2.8 7.7-7 8.8-4.2-1.1-7-4.7-7-8.8V7l7-3.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="m9.2 12 1.9 1.9 3.7-3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  {% elif key == "defense" %}
  <svg viewBox="0 0 24 24" fill="none">
    <path d="M12 3.8 19 7v4.8c0 4.3-2.9 8-7 9.2-4.1-1.2-7-4.9-7-9.2V7l7-3.2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M12 8.2v8.2M9.2 12.3h5.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  </svg>
  {% elif key == "creditors" %}
  <svg viewBox="0 0 24 24" fill="none">
    <path d="M12 4.5v12.5M8.5 20h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M5 8h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M5 8c0 2.4 1.3 4.3 3 4.3S11 10.4 11 8M19 8c0 2.4-1.3 4.3-3 4.3S13 10.4 13 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12" cy="4.5" r="1.1" stroke="currentColor" stroke-width="1.6"/>
  </svg>
  {% else %}
  <svg viewBox="0 0 24 24" fill="none">
    <circle cx="12" cy="12" r="8.25" stroke="currentColor" stroke-width="1.6"/>
    <path d="M12 8.2v4.1l2.4 1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  {% endif %}
</span>
{% endwith %}
